name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Portal and browser smoke matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current branch
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Portal dependencies
        run: pnpm --dir apps/portal install --frozen-lockfile

      - name: Run unit and integration tests
        run: pnpm test

      - name: Run lint
        run: pnpm lint

      - name: Build Portal and browser-test types
        run: pnpm build

      - name: Install required Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run Chromium desktop and WebKit iPhone smoke projects
        run: pnpm test:browser

      - name: Upload browser failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics
          path: |
            test-results/playwright/chromium/
            test-results/playwright/webkit-iphone/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
